name: recon
on:
  push:
    paths: ["recon/**", ".github/workflows/recon.yml"]
jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests beautifulsoup4
      - run: python recon/recon.py
